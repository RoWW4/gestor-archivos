name: Crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        env:
          FIRMA_JKS: ${{ secrets.FIRMA_JKS }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: |
          if [ -n "$FIRMA_JKS" ]; then echo "$FIRMA_JKS" | base64 -d > app/firma.jks; fi
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --stacktrace
          cp app/build/outputs/apk/release/app-release.apk gestor-archivos.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Versión 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: gestor-archivos.apk
          make_latest: true
